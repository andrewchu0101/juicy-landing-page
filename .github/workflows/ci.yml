# issue 012（部分）：型別檢查、單元測試、建置。
# 不含 lint（eslint 未核准）、INV-11 鎖定檔比對（共用模組尚未存在）、Vercel 與任何憑證（D-11 未核准）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
