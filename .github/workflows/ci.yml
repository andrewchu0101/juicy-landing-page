# issue 012（部分）：型別檢查、lint、單元測試、建置。
# 不含 INV-11 鎖定檔比對（共用模組尚未存在）、Vercel 與任何憑證（D-11 未核准）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（2026-11-11 解析）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4（2026-11-11 解析）
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
